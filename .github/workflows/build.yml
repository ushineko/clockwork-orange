name: Build

# Spec 010 R8.6. Every job builds from this checkout; the version is .tag.
# Windows and macOS binaries are stamped through a generated file in
# internal/buildinfo because `fyne package` drives the Go build itself.

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  FYNE_TOOL: fyne.io/tools/cmd/fyne@latest

jobs:
  test-go:
    name: Go Test + Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        check-latest: true
    - name: Install Fyne build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols
    - name: Test
      run: make test
    - name: Lint
      run: make lint
    - name: Build daemon (no CGO)
      run: CGO_ENABLED=0 make build
    - name: Build GUI
      run: make build-gui

  build-arch:
    name: Build Arch Package
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
    - name: Install build dependencies
      run: |
        pacman -Sy --noconfirm archlinux-keyring
        pacman -Su --noconfirm
        pacman -S --noconfirm base-devel git go gcc pkgconf mesa libgl libx11 libxcursor libxrandr \
          libxinerama libxi libxxf86vm libxkbcommon wayland wayland-protocols qt6-tools kconfig nodejs
        useradd -m builder
        echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
    - uses: actions/checkout@v4
      with:
        path: src_repo
        fetch-depth: 0
    - name: Build package
      run: |
        chown -R builder:builder src_repo
        su builder -c "git config --global --add safe.directory $(pwd)/src_repo"
        su builder -c "cd src_repo/packaging/arch && BUILDDIR=/tmp/mkpkg makepkg -s --noconfirm"
    - name: Install and self-test
      run: |
        pacman -U --noconfirm src_repo/packaging/arch/*.pkg.tar.zst
        clockwork-orange version
        clockwork-orange --self-test
        clockwork-orange-gui --version
    - uses: actions/upload-artifact@v4
      with:
        name: arch-package
        path: src_repo/packaging/arch/*.pkg.tar.zst

  build-deb:
    name: Build Debian Package
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        check-latest: true
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols dpkg-dev
    - name: Build package
      run: |
        make build build-gui
        ./packaging/debian/build.sh
    - name: Install and smoke-test
      run: |
        sudo apt-get install -y ./dist/*.deb
        clockwork-orange version
        clockwork-orange plugins list
        clockwork-orange-gui --version
        # The KDE tools the self-test probes are Recommends; the runner has no
        # Plasma. Run the full self-test only where they installed.
        if command -v qdbus6 >/dev/null && command -v kwriteconfig6 >/dev/null; then
          clockwork-orange --self-test
        else
          echo "qdbus6/kwriteconfig6 not on this runner; self-test gated on Arch instead"
        fi
    - uses: actions/upload-artifact@v4
      with:
        name: debian-package
        path: dist/*.deb

  build-windows:
    name: Build Windows Executables
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        check-latest: true
    - name: Install MinGW (CGO for the GUI)
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: false
        install: mingw-w64-ucrt-x86_64-gcc
    - name: Stamp version and install the fyne tool
      run: |
        $ver = (Get-Content .tag -Raw).Trim().TrimStart('v')
        $sha = (git rev-parse --short HEAD).Trim()
        "package buildinfo`n`nfunc init() { Version = `"$ver`"; Commit = `"$sha`" }`n" | Set-Content internal/buildinfo/version_ci.go
        "APP_VERSION=$ver" | Add-Content $env:GITHUB_ENV
        go install $env:FYNE_TOOL
    - name: Build the CLI (no CGO)
      run: |
        $env:CGO_ENABLED = "0"
        New-Item -ItemType Directory -Force dist | Out-Null
        go build -trimpath -ldflags "-s -w" -o dist/clockwork-orange.exe ./cmd/clockwork-orange
    - name: Build the GUI (fyne package, windowsgui subsystem, embedded icon)
      run: |
        $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin;$env:PATH"
        $env:CGO_ENABLED = "1"
        # --icon is resolved relative to --src, so it must be absolute.
        fyne package --os windows --name clockwork-orange-gui --tags migrated_fynedo --icon "$PWD/packaging/icons/clockwork-orange-512x512.png" `
          --app-id io.ushineko.clockwork-orange --app-version $env:APP_VERSION --release --src ./cmd/clockwork-orange-gui
        $exe = Get-ChildItem -Recurse -Filter clockwork-orange-gui.exe | Select-Object -First 1
        if (-not $exe) { throw "fyne package produced no clockwork-orange-gui.exe" }
        Move-Item $exe.FullName dist/clockwork-orange-gui.exe
    - name: Self-test
      run: |
        $proc = Start-Process -FilePath ".\dist\clockwork-orange.exe" -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
        if ($proc.ExitCode -ne 0) { throw "self-test failed with exit code $($proc.ExitCode)" }
        .\dist\clockwork-orange.exe version
    - name: Zip
      run: Compress-Archive -Path dist\clockwork-orange.exe, dist\clockwork-orange-gui.exe, README.md, LICENSE -DestinationPath dist\clockwork-orange-windows-amd64.zip
    - uses: actions/upload-artifact@v4
      with:
        name: windows-zip
        path: dist/clockwork-orange-windows-amd64.zip

  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        check-latest: true
    - name: Stamp version and install the fyne tool
      run: |
        VER=$(tr -d 'v[:space:]' < .tag)
        SHA=$(git rev-parse --short HEAD)
        printf 'package buildinfo\n\nfunc init() { Version = "%s"; Commit = "%s" }\n' "$VER" "$SHA" > internal/buildinfo/version_ci.go
        echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
        go install "$FYNE_TOOL"
    - name: Build the CLI (no CGO) and the app bundle
      run: |
        mkdir -p dist
        CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/clockwork-orange ./cmd/clockwork-orange
        # --icon is resolved relative to --src, so it must be absolute.
        CGO_ENABLED=1 fyne package --os darwin --name "Clockwork Orange" --tags migrated_fynedo --icon "$PWD/packaging/icons/clockwork-orange-512x512.png" \
          --app-id io.ushineko.clockwork-orange --app-version "$APP_VERSION" --release --src ./cmd/clockwork-orange-gui
        APP=$(find . -maxdepth 3 -name "Clockwork Orange.app" -type d | head -1)
        [ -n "$APP" ] || { echo "fyne package produced no .app"; exit 1; }
        mv "$APP" dist/
        cp dist/clockwork-orange "dist/Clockwork Orange.app/Contents/MacOS/clockwork-orange"
    - name: Self-test
      run: |
        "dist/Clockwork Orange.app/Contents/MacOS/clockwork-orange" --self-test
        "dist/Clockwork Orange.app/Contents/MacOS/clockwork-orange" version
    - name: Zip
      run: |
        cd dist
        # -y keeps symlinks as symlinks; a Fyne bundle has none today, but a
        # dereferenced framework link is what broke the 2.9.8 release.
        zip -r -y "Clockwork-Orange-macOS.zip" "Clockwork Orange.app"
    - uses: actions/upload-artifact@v4
      with:
        name: macos-zip
        path: dist/Clockwork-Orange-macOS.zip

  release:
    name: Create Release
    needs: [test-go, build-arch, build-deb, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Refuse a tag that does not match .tag
      run: |
        WANT=$(tr -d '[:space:]' < .tag)
        GOT="${GITHUB_REF#refs/tags/}"
        [ "$WANT" = "$GOT" ] || { echo "::error::tag $GOT does not match .tag $WANT"; exit 1; }
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-aur:
    name: Publish to AUR
    needs: [build-arch, release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
    - name: Install tools
      run: |
        pacman -Sy --noconfirm archlinux-keyring
        pacman -S --noconfirm base-devel git openssh nodejs
        useradd -m builder
    - uses: actions/checkout@v4
    - name: Configure SSH for AUR
      # Explicit paths through GIT_SSH_COMMAND rather than ~/.ssh/config: in
      # the Arch container the v4.0.0 run failed with "Host key verification
      # failed" although the config asked for accept-new, so the host key is
      # fetched up front and ssh is told exactly which files to use.
      run: |
        mkdir -p "$HOME/.ssh"
        printf '%s\n' "${{ secrets.AUR_SSH_KEY }}" > "$HOME/.ssh/aur_deploy"
        chmod 600 "$HOME/.ssh/aur_deploy"
        ssh-keyscan -t ed25519,rsa aur.archlinux.org >> "$HOME/.ssh/known_hosts" 2>/dev/null
        chmod 600 "$HOME/.ssh/known_hosts"
        echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/aur_deploy -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
    - name: Clone AUR repo
      run: git clone ssh://aur@aur.archlinux.org/clockwork-orange-git.git aur-pkg
    - name: Update PKGBUILD and regenerate .SRCINFO
      run: |
        PKGVER=$(tr -d 'v[:space:]' < .tag)
        cp packaging/arch/aur/PKGBUILD packaging/arch/clockwork-orange.install aur-pkg/
        sed -i "s/^pkgver=.*/pkgver=${PKGVER}/" aur-pkg/PKGBUILD
        chown -R builder:builder aur-pkg
        # makepkg refuses to run as root; --printsrcinfo needs no network and no build.
        su builder -c "cd aur-pkg && makepkg --printsrcinfo > .SRCINFO"
        chown -R root:root aur-pkg
    - name: Commit and push
      run: |
        cd aur-pkg
        git config user.name "ushineko"
        git config user.email "ushineko@users.noreply.github.com"
        git add PKGBUILD clockwork-orange.install .SRCINFO
        if git diff --cached --quiet; then
          echo "No changes to publish"
        else
          git commit -m "Update to $(tr -d '[:space:]' < ../.tag)"
          git push
        fi
